# Parcours de la page À propos (include parcours.html) : frise animée + tableaux repliés.
# Sections : pro (Parcours), asso (Associatif), formation (Formation). L'ordre du fichier = ordre d'affichage.
# Entrée :
#   start / end : "AAAA" ou "AAAA-MM" (AAAA seul = janvier pour start, décembre pour end).
#                 Sans `end` : en cours ("Depuis AAAA").
#   fr / en     : { title, org, detail }. `short` (optionnel) : libellé court de la frise.
#   roles       : (optionnel) sous-rôles, chacun avec start/end/fr/en ; une barre par rôle dans la frise,
#                 une seule ligne regroupée dans le tableau.
# Les dates au mois près servent seulement à la frise ; le tableau n'affiche que les années.
