# Matériel de la page À propos (include atelier-grid.html).
# current : utilisé régulièrement aujourd'hui, une tuile par famille de machines.
#   type  : famille (fr/en).
#   items : machines.
#     model : nom de la machine.
#     use   : [pro, perso] : MakerSpace et/ou atelier perso (badges).
#     url   : (optionnel) doc ou page officielle du fabricant (lien externe ↗).
#     link  : (optionnel) page du site liée : projet, article, log.
# past : utilisé avant, liste simple sous la grille. `more` : mention de fin ("et bien d'autres").
# Liens vérifiés le 2026-10-04. Sans page officielle trouvée (K40, P3, Laserbox, Cameo) : pas de lien.
