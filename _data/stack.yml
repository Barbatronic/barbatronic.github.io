# Grille "Stack" de la page À propos (include stack-grid.html).
# Une entrée = une catégorie (fr/en) et ses outils.
# Outil : `name` (affiché), `en` (libellé anglais si différent), `q` (terme de recherche si différent de name).
# Le compteur de projets cherche `q` (ou `name`) dans le `stack` et les tags de chaque fiche projet,
# et le lien ouvre /projets/?q=<terme>. Sans projet correspondant, l'outil s'affiche sans lien.
