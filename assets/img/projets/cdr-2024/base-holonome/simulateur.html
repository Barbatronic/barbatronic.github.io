/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* Habillage du simulateur aux couleurs du site barbatronic.fr (_sass/barbatronic/_tokens.scss) :
   noir et blanc, traits de 2 px, titres en Barlow Condensed capitales, libellés en JetBrains Mono.
   Surcharge le style du kit teardown (fond sombre, #app plein écran). */
:root {
  --ink: #0e0e0e; --paper: #ffffff; --muted: #555555; --grid-line: #ededed; --hatch: #dedede;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --rule: 2px solid var(--ink); --rule-thin: 1px solid var(--ink);
  --side: 340px;
}
html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; }
#app { position: fixed; inset: 0; font-family: var(--font-body); color: var(--ink); }
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }

.sim { position: relative; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }

/* en-tête */
.hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding: 14px 20px 12px; border-bottom: var(--rule); }
.hd .kicker { color: var(--muted); }
.hd h1 { margin: 2px 0 0; font: 700 34px/0.92 var(--font-display); text-transform: uppercase; letter-spacing: 0.005em; }
.hd p { margin: 6px 0 0; color: var(--muted); }
.tour { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 12px; border: var(--rule); background: var(--paper); cursor: pointer; font-weight: 700; }
.tour i { width: 8px; height: 8px; background: var(--ink); display: inline-block; }
.tour.on i { animation: blink 1.2s steps(2) infinite; }
.tour:hover { background: var(--ink); color: var(--paper); }
.tour:hover i { background: var(--paper); }
@keyframes blink { 50% { opacity: 0.1; } }

.body { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--side); }

/* vue 3D */
.view { position: relative; min-height: 0; overflow: hidden; background: var(--paper); container-type: size; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.drag { cursor: grabbing; }
.lay { position: absolute; inset: 0; pointer-events: none; }
.lay svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lay .lb { text-transform: none; position: absolute; transform: translate(0, -100%); padding: 3px 6px; background: var(--paper); border: var(--rule-thin); white-space: nowrap; font-weight: 700; }
.phase { position: absolute; left: 16px; top: 14px; max-width: min(380px, calc(100% - 32px)); background: rgba(255, 255, 255, 0.92); border: var(--rule); padding: 10px 12px 11px; pointer-events: none; }
.phase .n { display: flex; justify-content: space-between; color: var(--muted); }
.phase h2 { margin: 3px 0 4px; font: 700 30px/0.95 var(--font-display); text-transform: uppercase; }
.phase p { margin: 0; font-size: 14px; line-height: 1.4; }
.tools { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: calc(100% - 24px); }
.grp { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0; background: var(--paper); border: var(--rule); }
.grp .gcap { padding: 6px 8px; color: var(--muted); border-right: var(--rule-thin); }
.bt { min-height: 30px; padding: 5px 9px; border: 0; border-right: var(--rule-thin); background: var(--paper); cursor: pointer; font-weight: 700; }
.bt:last-child { border-right: 0; }
.bt:hover { background: #ececec; }
.bt.on { background: var(--ink); color: var(--paper); }
.hint { position: absolute; left: 16px; bottom: 10px; color: var(--muted); pointer-events: none; }
.veil { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; }

/* curseur de la visite */
.cur { position: absolute; left: 0; top: 0; width: 18px; height: 18px; pointer-events: none; z-index: 5; display: none; }
.cur svg { display: block; }
.ring { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 2px solid var(--ink); border-radius: 50%; pointer-events: none; opacity: 0; z-index: 5; }

/* colonne de mesures */
.col { min-height: 0; overflow: auto; border-left: var(--rule); }
.pn { padding: 10px 16px 11px; border-bottom: var(--rule); }
.pn:last-child { border-bottom: 0; }
.pn h3 { margin: 0 0 7px; display: flex; justify-content: space-between; font: 700 11px/1.2 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; }
.pn h3 span { color: var(--muted); font-weight: 400; }
.big { display: flex; align-items: baseline; gap: 6px; }
.big b { font: 700 40px/0.9 var(--font-display); font-variant-numeric: tabular-nums; }
.big small { color: var(--muted); }
.meter { height: 8px; border: var(--rule-thin); margin: 6px 0 8px; position: relative; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.wrows { display: grid; gap: 4px; }
.wr { display: grid; grid-template-columns: auto 1fr; align-items: baseline; gap: 0 10px; border: var(--rule-thin); padding: 4px 8px 6px; }
.wr span { color: var(--muted); font-size: 10px; }
.wr b { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.wr .rpm { grid-column: 1 / -1; text-align: right; }
.wr i { grid-column: 1 / -1; height: 4px; background: var(--grid-line); margin-top: 4px; position: relative; display: block; }
.wr i::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ink); }
.wr u { position: absolute; top: 0; bottom: 0; background: currentColor; }
.wr.idle { background: repeating-linear-gradient(-45deg, var(--paper) 0 3px, var(--hatch) 3px 5px); }
.top .ol { fill: none; stroke: var(--grid-line); stroke-width: 1.5; }
.top .wh { fill: var(--ink); }
.top .dr, .top .rv { stroke: var(--ink); stroke-width: 2.2; fill: none; }
.top .sl { stroke: #8a8a8a; stroke-width: 2; stroke-dasharray: 4 3; }
.legend { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 10px; }
.legend .k { width: 14px; height: 0; display: inline-block; border-top: 2px solid var(--ink); margin-left: 4px; }
.legend .k.sl { border-top: 2px dashed #8a8a8a; }
.legend .k.rv { border-top-width: 3px; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: var(--font-mono); font-size: 9px; fill: var(--muted); }
.note { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }

/* frise de la séquence */
.tl { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 10px 20px; border-top: var(--rule); }
.play { width: 40px; height: 40px; border: var(--rule); background: var(--ink); color: var(--paper); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.play:hover { background: #333; }
.track { position: relative; height: 40px; cursor: pointer; touch-action: none; container-type: inline-size; }
.track .rail { position: absolute; left: 0; right: 0; top: 24px; height: 4px; background: var(--grid-line); }
.track .fill { position: absolute; left: 0; top: 24px; height: 4px; background: var(--ink); }
.track .knob { position: absolute; top: 18px; width: 4px; height: 16px; margin-left: -2px; background: var(--ink); }
.track .tick { position: absolute; top: 0; height: 30px; border-left: var(--rule-thin); padding-left: 4px; color: var(--muted); white-space: nowrap; font-size: 10px; }
.track .tick.on { color: var(--ink); font-weight: 700; }
.clock { font-variant-numeric: tabular-nums; }
.speed { display: flex; border: var(--rule); }
.speed .bt { min-height: 28px; }

/* écran ou cadre étroit : vue, frise, puis mesures ; la page défile */
@media (max-width: 860px) {
  html { overflow: auto; height: auto; }
  body { overflow: visible; height: auto; }
  #app { position: static; }
  .sim { height: auto; display: flex; flex-direction: column; }
  .body { display: contents; }
  .hd { order: 0; padding: 12px 16px 10px; }
  .hd .kicker { display: none; }
  .hd h1 { font-size: 28px; }
  .view { order: 1; height: clamp(340px, calc(100vh - 176px), 640px); flex: none; }
  .tl { order: 2; padding: 8px 16px; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; border-bottom: var(--rule); }
  .tl .speed { display: none; }
  .col { order: 3; border-left: 0; overflow: visible; }
  .phase { left: 10px; top: 10px; padding: 8px 10px; }
  .phase h2 { font-size: 24px; }
  .phase p { font-size: 12px; }
  .tools { left: 10px; right: auto; bottom: 10px; align-items: flex-start; }
  .grp { justify-content: flex-start; }
}
@media (min-width: 600px) and (max-width: 860px) {
  .col { display: grid; grid-template-columns: 1fr 1fr; }
  .pn:nth-child(odd) { border-right: var(--rule); }
  .pn:last-child { grid-column: 1 / -1; border-right: 0; }
}
/* intégrée au site (iframe) : seul le bouton de visite reste dans l'en-tête */
.embedded .hd > div { display: none; }
.embedded .hd { padding: 8px 16px; justify-content: flex-end; }

/* vue étroite : l'aide clavier laisse la place aux boutons ; frise étroite : numéros de phase seuls */
@container (max-width: 980px) { .hint { display: none; } }
@container (max-width: 1000px) { .tick span { display: none; } }
@media (prefers-reduced-motion: reduce) { .tour.on i { animation: none; } }

</style>
</head>
